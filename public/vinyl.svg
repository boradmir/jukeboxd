<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="vinylGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff6b9d;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Outer ring -->
  <circle cx="50" cy="50" r="48" fill="#1a1a2e" stroke="url(#vinylGradient)" stroke-width="2"/>
  <!-- Vinyl grooves -->
  <circle cx="50" cy="50" r="40" fill="none" stroke="#2a2a3e" stroke-width="1"/>
  <circle cx="50" cy="50" r="35" fill="none" stroke="#2a2a3e" stroke-width="0.5"/>
  <circle cx="50" cy="50" r="30" fill="none" stroke="#2a2a3e" stroke-width="1"/>
  <circle cx="50" cy="50" r="25" fill="none" stroke="#2a2a3e" stroke-width="0.5"/>
  <!-- Center label -->
  <circle cx="50" cy="50" r="15" fill="url(#vinylGradient)"/>
  <!-- Center hole -->
  <circle cx="50" cy="50" r="3" fill="#14181c"/>
</svg>
