<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14181c"/>
      <stop offset="100%" stop-color="#1a1f25"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#ff6b9d"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="400" height="300" fill="url(#bgGrad)"/>
  
  <!-- Glowing orbs -->
  <circle cx="100" cy="60" r="40" fill="#00d4ff" opacity="0.1" filter="url(#glow)"/>
  <circle cx="300" cy="240" r="50" fill="#ff6b9d" opacity="0.1" filter="url(#glow)"/>
  
  <!-- 404 text -->
  <text x="200" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="80" font-weight="bold" fill="url(#accentGrad)" filter="url(#glow)">404</text>
  
  <!-- Broken vinyl illustration -->
  <g transform="translate(200, 200)">
    <!-- Left piece -->
    <path d="M-50 -20 C-60 0 -40 30 -20 20 L0 0 L-30 -30 Z" fill="#2a2a3e" stroke="#00d4ff" stroke-width="1.5"/>
    <!-- Right piece -->
    <path d="M50 -20 C60 0 40 30 20 20 L0 0 L30 -30 Z" fill="#2a2a3e" stroke="#ff6b9d" stroke-width="1.5"/>
    <!-- Center hole remnant -->
    <circle cx="0" cy="0" r="8" fill="url(#accentGrad)" opacity="0.5"/>
  </g>
  
  <!-- Floating music notes -->
  <g fill="url(#accentGrad)" opacity="0.3">
    <text x="80" y="180" font-size="24">♪</text>
    <text x="320" y="100" font-size="20">♫</text>
    <text x="50" y="250" font-size="18">♪</text>
    <text x="350" y="180" font-size="22">♫</text>
  </g>
</svg>
